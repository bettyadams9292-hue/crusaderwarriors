  B.eM=1+(B.routeIndex||0)*.15;
  director(d,B.n,(B.routeIndex||0)+1);
  defAI(dt,d,B.n);
  const fats=B.en.filter(e=>e.t==='fat');
  bat4(dt);
  for(const e of fats)if(!B.en.includes(e))acidBurst(e);
  if(B.end===1)B.end=0;
  if(B.end<0)return;
  if(B.tm>=DAYLEN){
    const next=(B.routeIndex||0)+1;
    if(next>=5){
      if(score>best){best=score;try{localStorage.setItem('ikbest',best)}catch(e){}}
      S='win';
      return;
    }
    score+=next*50;
    P.money=(P.money||0)+100+next*50;
    P.hp=Math.min(P.mhp,P.hp+P.mhp*.35);
    B.routeIndex=next;
    B.en=[];B.q=[];B.tr=[];B.traps=[];B.tool=null;
    B.tm=0;B.n=0;B.ni=1;
    stage=Math.min(9,next*3);
    S='map';
  }
};

let last=performance.now();
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;X.setTransform(2,0,0,2,0,0);
if(S=='menu')menu();else if(S=='map')drawMap();else if(S=='perk')drawPerk();else if(S=='load')drawLoad();else if(S=='custom')drawCust();else if(S=='shop')drawShop();else{if(S=='battle')bat(dt);drawBat();if(S=='over')end('KILLED IN ACTION','#e44','Fell on stage '+(stage+1)+' of 12');if(S=='win')end('VICTORY','#8c4','Campaign complete: all four theatres cleared')}
if(S!='menu')vig();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
